<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x-viewer CAD 在线预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1e293b;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
.header{background:#0f172a;padding:0.75rem 1.25rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid #334155}
.header h1{font-size:1rem;font-weight:600;color:#f1f5f9}
.header .sub{font-size:0.75rem;color:#64748b}
#cad-container{flex:1;position:relative;overflow:hidden}
#myCanvas{width:100%;height:100%}
.toolbar{background:#0f172a;padding:0.5rem 1rem;display:flex;gap:0.5rem;align-items:center;border-top:1px solid #334155}
.toolbar button{background:#334155;color:#e2e8f0;border:none;padding:0.375rem 0.75rem;border-radius:4px;font-size:0.75rem;cursor:pointer;transition:background 0.15s}
.toolbar button:hover{background:#475569}
.toolbar input[type="file"]{font-size:0.75rem;color:#94a3b8}
.status{font-size:0.7rem;color:#64748b;margin-left:auto}
.demo-link{font-size:0.7rem;color:#3b82f6;text-decoration:none}
.demo-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="header">
  <h1>📐 x-viewer CAD 预览</h1>
  <span class="sub">基于 @x-viewer/core · WebGL/Three.js</span>
  <a class="demo-link" href="https://cad.thingraph.site" target="_blank">在线体验 →</a>
</div>
<div id="cad-container">
  <div id="myCanvas"></div>
</div>
<div class="toolbar">
  <input type="file" id="fileInput" accept=".dwg,.dxf,.pdf,.gltf,.glb,.obj,.fbx,.stl,.ifc,.stp,.step">
  <button onclick="loadFile()">📂 加载文件</button>
  <button onclick="loadDemo()">🔧 加载示例</button>
  <button onclick="viewer?.goToHomeView()">🏠 适应视图</button>
  <span class="status" id="status">就绪</span>
</div>

<script type="importmap">
{
  "imports": {
    "@x-viewer/core": "https://esm.sh/@x-viewer/core@0.21.23?bundle"
  }
}
</script>
<script type="module">
import { Viewer2d } from '@x-viewer/core'

// 默认示例 DWG 文件
const DEMO_URL = './sample.dwg'
const FONT_URLS = [
  'https://x-viewer-demo.s3.us-west-1.amazonaws.com/hztxt.shx',
  'https://x-viewer-demo.s3.us-west-1.amazonaws.com/simplex.shx',
]

let viewer = null
const setStatus = (msg, type='info') => {
  const el = document.getElementById('status')
  el.textContent = msg
  el.style.color = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#64748b'
}

window.viewer = viewer

async function loadDemo() {
  setStatus('加载示例图纸...')
  try {
    if (!viewer) {
      viewer = new Viewer2d({ containerId: 'myCanvas', enableSpinner: true, enableLayoutBar: true })
      window.viewer = viewer
      try { await viewer.setFont(FONT_URLS) } catch(e) { console.warn('字体加载失败，不影响查看', e) }
    }
    await viewer.loadModel({ modelId: 'demo', src: DEMO_URL, name: '示例图纸' }, (e) => {
      const pct = Math.round((e.loaded * 100) / e.total)
      setStatus(`加载中 ${pct}%`)
    })
    viewer.goToHomeView()
    setStatus('✅ 加载完成', 'success')
  } catch(e) {
    setStatus(`❌ 加载失败: ${e.message}`, 'error')
    console.error(e)
  }
}

window.loadDemo = loadDemo

window.loadFile = async function() {
  const file = document.getElementById('fileInput').files[0]
  if (!file) return alert('请选择一个 CAD 文件')
  
  setStatus('加载文件...')
  try {
    if (!viewer) {
      viewer = new Viewer2d({ containerId: 'myCanvas', enableSpinner: true, enableLayoutBar: true })
      window.viewer = viewer
      try { await viewer.setFont(FONT_URLS) } catch(e) { console.warn('字体加载失败，不影响查看', e) }
    }
    // 读取本地文件为 URL
    const url = URL.createObjectURL(file)
    await viewer.loadModel({ modelId: file.name, src: url, name: file.name })
    viewer.goToHomeView()
    setStatus(`✅ ${file.name} 加载完成`, 'success')
  } catch(e) {
    setStatus(`❌ 加载失败: ${e.message}`, 'error')
    console.error(e)
  }
}

// 自动加载示例
loadDemo()
</script>
</body>
</html>
